[project]
name = "bili-knowledge-pipeline"
version = "0.1.0"
description = "B 站课程视频 → 逐字稿 → AI 可加载的 Agent Skills 知识库"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
